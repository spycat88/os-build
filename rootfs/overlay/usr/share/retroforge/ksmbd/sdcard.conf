; The [sdcard] network share, appended to /etc/ksmbd/ksmbd.conf in /run/retroforge/ksmbd.conf only
; while an SD card is mounted (usr/lib/retroforge/storage/sdcard-share), so with no card the share
; is not listed at all, and it appears when one goes in.
;
; The card itself, ROMs in its roms/<system>/ folders (the plugin's rom_roots.gd). udisks mounts a
; card under /run/media/player/<label>, a path that changes with the card, so
; usr/lib/retroforge/storage/automount.sh bind-mounts it here and takes it down when the card is
; unmounted or pulled out. A client still connected when a card goes in should reconnect.
[sdcard]
	comment = SD card: put ROMs in roms, one folder per system
	path = /run/retroforge/sdcard
	guest ok = yes
	read only = no
