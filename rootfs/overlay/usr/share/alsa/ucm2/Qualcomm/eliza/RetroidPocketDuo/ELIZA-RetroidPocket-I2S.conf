Syntax 4

# Retroid Pocket Duo (SM7750 Eliza). Card model = "ELIZA-RetroidPocket-I2S" (armada's
# sm7750-retroidpocket-duo.dts); the card driver is sc8280xp.c's qcom,eliza-sndcard entry
# (kernel/patches/0879), whose short name is eliza, so the conf.d symlink lives under conf.d/eliza/.
# AudioReach on the ADSP, topology qcom/eliza/ELIZA-RetroidPocket-I2S-tplg.bin: speaker through the
# AW88166 amp on PRIMARY_MI2S, headphones and headset mic through the ES8326 on QUATERNARY_MI2S,
# built-in mic on the LPASS VA macro DMIC.
#
# Ported 2026-11-21 from armada (system_files/usr/share/alsa/ucm2/RetroidPocket/ELIZA/, by Teguh
# Sobirin); HiFi.conf is unchanged apart from this path. Not yet heard on the board.

Comment "Retroid Pocket Duo"

SectionUseCase."HiFi" {
	File "/Qualcomm/eliza/RetroidPocketDuo/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
