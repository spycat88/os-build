# Which CPUs a service may run on, by CLASS rather than by CPU number, so a SoC with a different
# core layout needs no edit here. Read at every boot by
# /usr/lib/systemd/system-generators/retroforge-cpu-affinity, which resolves each class against the
# live topology (cpu_capacity) and writes a CPUAffinity= drop-in for the unit.
#
#   interactive   every CPU outside the highest-capacity (prime) cluster. For the services a game
#                 talks to: they stay responsive, but off the core a game's heaviest thread runs on.
#   background    the lowest-capacity (little) cluster. For daemons that need no speed.
#
# Both classes always include cpu0, the one CPU the suspend engine never offlines. On a SoC whose
# cores all have the same capacity (or no cpu_capacity at all) nothing is written and every
# service keeps every CPU. Affinity is inherited by a service's whole process tree.
#
# <unit>                          <class>

inputplumber.service                interactive
# PowerStation: OGUI's performance backend (profiles, TDP), the role Steam's steamos-manager plays.
powerstation.service                interactive
retroforge-powerbuttond.service     interactive
# Tailscale: its WireGuard is userspace, so a stream or a copy over the tailnet is encrypted on
# the CPU. Not the little cluster (too slow for that), not the game's prime core.
tailscaled.service                  interactive

retroforge-powerd.service           background
retroforge-pairingd.service         background
retroforge-power-led.service        background
