RETROFORGE_DEVICE_ID=mangmi-air-y
RETROFORGE_DEVICE_NAME='MANGMI Air Y'
RETROFORGE_SOC_CLASS=SM6115
# Kernel suspend-to-RAM (retroforge-suspend kernel_sleep), not the fake-suspend default.
RETROFORGE_SUSPEND_MODE=mem

# MANGMI Air Y (sm6115-mangmi-air-y.dts, ROCKNIX `next` 2026-10-05): the Air X board — same SoC,
# PMIC, charger, gauge, codec + one AW88261 amp, serdev MCU joypad — behind a LANDSCAPE-NATIVE
# 1280x960 4:3 panel (mangmi,gh7005, kernel/patches/0585, one 60 Hz mode; the DTS deletes the base
# tree's rotation) with a Hynitron CST3530 touch controller (0739). Not yet booted on RetroForge.
#
# LANDSCAPE, like the Air Y Pro: retroforge-session takes the native mode as the logical canvas.
RETROFORGE_PANEL_ORIENTATION=landscape
RETROFORGE_PRIMARY_CONNECTOR=DSI-1
RETROFORGE_PANEL_NATIVE_WIDTH=1280
RETROFORGE_PANEL_NATIVE_HEIGHT=960
RETROFORGE_PANEL_REFRESH_RATES=60
# 4:3 -> 133x100 per defaults.conf. Not yet measured on this panel.
RETROFORGE_GAMESCOPE_FAKE_OUTPUT_MM=133x100

# Hardware map (hw-map; docs/hardware-map.md). The Air X board's power, thermal, fan and GPU nodes
# (see the Air X profiles), so the same names and the same CPU zone (cpu67, the A73 pair, runs
# hottest); the backlight is the same pwm-backlight node with its own range. One ten-pixel RGB ring
# (leds-group-multicolor rgb:l1-l10 over one aw20036; the left_red/green/blue_N single-colour nodes
# are the same diodes' channels). The ring and the CPU zone were seen on the device 2026-10-11.
RETROFORGE_HW_BATTERY=battery
RETROFORGE_HW_CHARGER=bq256xx-charger
RETROFORGE_HW_BACKLIGHT=backlight
RETROFORGE_HW_THERMAL_CPU=cpu67-thermal
RETROFORGE_HW_THERMAL_GPU=gpu-thermal
RETROFORGE_HW_THERMAL_BATTERY=battery-thermal
RETROFORGE_HW_FAN=pwmfan
RETROFORGE_HW_GPU_DEVFREQ=5900000.gpu
RETROFORGE_HW_LED_GROUPS="ring=rgb:l*"

# Fan: a pwm-fan over a 15 Hz GPIO PWM (kernel/dts .../sm6115-mangmi-air-x-base.dtsi). Listening
# tests on the Air Y 2026-10-11: 15 Hz is the best rate and runs smoothly at 40% duty -> floor 102;
# off below 60 C, so the idle shell is silent (it used to be either off or full speed).
RETROFORGE_FAN_MIN_PWM=102
RETROFORGE_FAN_OFF_BELOW=60

# Stock scheduler only. scx_lavd on this SoC put one of two game threads on the A53s, which then
# missed 76-86% of its 60 fps deadlines under every governor (HW, Air X, 2026-10-10).
RETROFORGE_CPU_SCHEDULERS=none

# The shell on OpenGL, as on the Air X (same SoC): ~130 MiB more RAM left to games, more long frames
# while navigating than Vulkan. Settings > Display > Vulkan renderer switches it.
RETROFORGE_UI_RENDERER=opengl
