RETROFORGE_DEVICE_ID=retroid-pocket-5-visionox
RETROFORGE_DEVICE_NAME='Retroid Pocket 5 Visionox'
RETROFORGE_SOC_CLASS=SM8250
# Kernel suspend-to-RAM (retroforge-suspend kernel_sleep), not the fake-suspend default.
RETROFORGE_SUSPEND_MODE=mem

# The Visionox VTDR6130 panel some Pocket 5 units ship with instead of the CH13726A
# (sm8250-retroidpocket-rp5-visionox.dts includes rp5.dts and swaps the panel node; driver
# kernel patch 0556). Same 1080x1920 portrait native, but it declares 120 and 60 Hz modes.
RETROFORGE_PRIMARY_CONNECTOR=DSI-1
RETROFORGE_PANEL_NATIVE_WIDTH=1080
RETROFORGE_PANEL_NATIVE_HEIGHT=1920
RETROFORGE_PANEL_REFRESH_RATES=60,120
RETROFORGE_GAMESCOPE_FAKE_OUTPUT_MM=177x100

# Hardware map (hw-map; docs/hardware-map.md has the per-SoC reasoning). Names read off this
# board's DTS and the drivers' naming, cross-checked with ROCKNIX `next`; not yet read off this
# board running RetroForge, so a wrong one is logged and detected instead.
# Backlight: the vtdr6130 panel's own DCS backlight on mdss_dsi0 (the same device name as the
# ch13726a's). LEDs: the stick rings, four RGB segments a side (leds-group-multicolor over two
# HTR3212s; multi_index reads blue green red).
RETROFORGE_HW_BATTERY=battery
RETROFORGE_HW_CHARGER=pm8150b-charger
RETROFORGE_HW_BACKLIGHT=ae94000.dsi.0
RETROFORGE_HW_THERMAL_CPU=cpu7-top-thermal
RETROFORGE_HW_THERMAL_GPU=gpu-top-thermal
RETROFORGE_HW_THERMAL_SKIN=skin-msm-thermal
RETROFORGE_HW_FAN=pwmfan
RETROFORGE_HW_GPU_DEVFREQ=3d00000.gpu
RETROFORGE_HW_LED_GROUPS="ring-left=rgb:l* ring-right=rgb:r*"
