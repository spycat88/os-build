RETROFORGE_DEVICE_ID=retroid-pocket-duo
RETROFORGE_DEVICE_NAME='Retroid Pocket Duo'
RETROFORGE_SOC_CLASS=SM7750

# Two DSI panels, as on the Thor Lite: the top vtdr6130,rpduo (kernel/patches 0557, 1080x1920
# video mode, rotation 270) on mdss_dsi0, and the bottom retroidpocket,rpduo-panel-bottom (0561,
# the IL97680A in command mode, 1280x960 landscape-native, rotation 0) on mdss_dsi1.
# The connectors are taken from armada's retroid-pocket-duo.conf (top DSI-1, bottom DSI-2), which
# its maintainers run on the device; NOT yet read off this board running RetroForge. The Thor Lite
# profile has the history of guessing this wrong, so read /sys/class/drm on the first boot.
# armada's gamescope-session quirk (gamescope-session patch 0010) disagrees: it lists
# OUTPUT_CONNECTOR='*,DSI-2,DSI-1' under "Prefer top screen". The device profile is the one that
# pairs each connector with its backlight and touchscreen, so it wins here until the device says.
# Not carried from that quirk: GAMESCOPE_NO_BLANK_OVERLAY_LAYER (armada gamescope 0033, the blank
# Steam-overlay layer pins one of the Duo's two rotatable planes) and the linear bottom-panel
# output (armada 0034, the bottom panel corrupts UBWC scanout). Both are patches to armada's own
# gamescope; ours drives the bottom panel from the same instance (patches 0040-0046), so they
# need porting there and a device to check them on.
# Refresh: both modes of the vtdr6130 rp6 table, which the Duo's desc reuses.
RETROFORGE_PRIMARY_CONNECTOR=DSI-1
RETROFORGE_PANEL_NATIVE_WIDTH=1080
RETROFORGE_PANEL_NATIVE_HEIGHT=1920
RETROFORGE_PANEL_REFRESH_RATES=60,120
RETROFORGE_GAMESCOPE_FAKE_OUTPUT_MM=177x100

# The bottom panel. Touch: a FocalTech ft5452 on each panel, labelled "top_touchscreen" (i2c8)
# and "bottom_touchscreen" (i2c6) in sm7750-retroidpocket-duo.dts. Native mode 1280x960 @ 120 Hz,
# read by gamescope off the connector; unrotated, so its plane needs no rotation.
RETROFORGE_SECONDARY_CONNECTOR=DSI-2
RETROFORGE_SECONDARY_TOUCHSCREEN=bottom_touchscreen

# Hardware map (hw-map; docs/hardware-map.md). Read off the board DTS and eliza.dtsi; not yet read
# off this board running RetroForge. Battery/charger: pmic-glink battmgr (qcom,eliza-pmic-glink
# falls back to the SM8550 one). Thermal: cpu7 is the Cortex-X3 prime core; Eliza names its GPU
# zones gpuss0.., as SM8650 does. Fan: pwm-fan on the PM7550 LPG with a tachometer (TLMM3).
# Backlight: both panels dim over DCS and register under their DSI device; the top one is
# ae94000.dsi.0, the bottom one ae96000.dsi.0. LEDs: the PM7550 LPG drives red/green charging
# LEDs (battery triggers) and a blue status LED, no stick rings; none is a power LED, so no groups.
RETROFORGE_HW_BATTERY=qcom-battmgr-bat
RETROFORGE_HW_CHARGER=qcom-battmgr-usb
RETROFORGE_HW_BACKLIGHT=ae94000.dsi.0
RETROFORGE_HW_THERMAL_CPU=cpu7-top-thermal
RETROFORGE_HW_THERMAL_GPU=gpuss0-thermal
RETROFORGE_HW_FAN=pwmfan
RETROFORGE_HW_GPU_DEVFREQ=3d00000.gpu
