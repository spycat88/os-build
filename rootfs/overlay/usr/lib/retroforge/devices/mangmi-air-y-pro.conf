RETROFORGE_DEVICE_ID=mangmi-air-y-pro
RETROFORGE_DEVICE_NAME='MANGMI Air Y Pro'
RETROFORGE_SOC_CLASS=SM8250
# Kernel suspend-to-RAM (retroforge-suspend kernel_sleep), not the fake-suspend default.
RETROFORGE_SUSPEND_MODE=mem

# MANGMI Air Y Pro (sm8250-mangmi-air-y-pro.dts), ported 2026-10-09 from ROCKNIX's SM8250 tree.
# Same SoC, PMICs, codec set and MCU joypad family as the Pocket Max; what differs is the display
# and touch: a LANDSCAPE-NATIVE 1280x960 4:3 panel (mangmi,air-y-pro-panel, kernel/patches/0580,
# one 60 Hz mode, no DTS rotation) on pm8150l WLED backlight + LCDB bias, and a Hynitron CST66xx
# touch controller (0736). Not yet booted on RetroForge; values from the panel driver and the DTS.
#
# LANDSCAPE: the first board in the fleet whose panel is not portrait. retroforge-session normally
# swaps the native mode into landscape; RETROFORGE_PANEL_ORIENTATION=landscape tells it not to.
RETROFORGE_PANEL_ORIENTATION=landscape
RETROFORGE_PRIMARY_CONNECTOR=DSI-1
RETROFORGE_PANEL_NATIVE_WIDTH=1280
RETROFORGE_PANEL_NATIVE_HEIGHT=960
RETROFORGE_PANEL_REFRESH_RATES=60
# 4:3, so per defaults.conf hold the vertical 100 mm and derive the width: 133x100. Not yet
# measured on this panel.
RETROFORGE_GAMESCOPE_FAKE_OUTPUT_MM=133x100

# Hardware map (hw-map; docs/hardware-map.md). From the DTS and the drivers; not yet booted. The
# Pocket Max's SoC side (PM8150B gauge and smb5 charger, the pwm-fan with no tachometer, the
# PM8150L skin thermistor), with two differences. Charger: pinned, because the board also enables
# an HL7139 charge pump whose hl7139-charger sorts first and reports online and status, but its
# `online` means "pump engaged" and reads 0 with a cable in. Backlight: the PM8150L WLED, which
# the panel links (label "backlight"). LEDs: the Pocket Max's two aw20036s, 48 single-colour
# {red,green,blue}:indicator-0..15 channels; the 0-7 left / 8-15 right split is the Pocket Max's,
# unconfirmed here (ROCKNIX has no Air Y Pro quirks).
RETROFORGE_HW_BATTERY=battery
RETROFORGE_HW_CHARGER=pm8150b-charger
RETROFORGE_HW_BACKLIGHT=backlight
RETROFORGE_HW_THERMAL_CPU=cpu7-top-thermal
RETROFORGE_HW_THERMAL_GPU=gpu-top-thermal
RETROFORGE_HW_THERMAL_SKIN=skin-msm-thermal
RETROFORGE_HW_FAN=pwmfan
RETROFORGE_HW_GPU_DEVFREQ=3d00000.gpu
RETROFORGE_HW_LED_GROUPS="ring-left=*:indicator-[0-7] ring-right=*:indicator-[89],*:indicator-1[0-5]"
