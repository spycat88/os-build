RETROFORGE_DEVICE_ID=retroid-pocket-classic-6
RETROFORGE_DEVICE_NAME='Retroid Pocket Classic 6'
RETROFORGE_SOC_CLASS=SM4450
# Kernel suspend-to-RAM (retroforge-suspend kernel_sleep), not the fake-suspend default.
RETROFORGE_SUSPEND_MODE=mem

# Retroid Pocket Classic 6 — Snapdragon G1 Gen 2 (SM4450: 2x A78 + 6x A55, Adreno 613). Read off
# the board DTS (sm4450-retroid-pocket-classic-6.dts, which includes the Classic DTS +
# sm4450-retroid-pocket-classic-common.dtsi) and the panel driver; NOT yet read off this board
# running RetroForge (no unit on hand when it was added, 2026-11-08). The Classic 6 differs from
# the Classic in its model string only (the face-button wiring, which InputPlumber keys off that
# string: 50-retroid_pocket_classic_6.yaml).
#
# One DSI link: the G1392 AMOLED (chipwealth,ch13726a + kernel patch 0536) on mdss_dsi0 ->
# card0-DSI-1, 1080x1240 portrait native with rotation=<90> in the DTS, which gamescope reads off
# the connector. The G1392 panel declares a single 60 Hz mode.
RETROFORGE_PRIMARY_CONNECTOR=DSI-1
RETROFORGE_PANEL_NATIVE_WIDTH=1080
RETROFORGE_PANEL_NATIVE_HEIGHT=1240
RETROFORGE_PANEL_REFRESH_RATES=60
# The AYANEO Pocket DMG's panel class (3.92", 1240x1080, ~65x75 mm): its 115x100, the fleet's
# density at this aspect.
RETROFORGE_GAMESCOPE_FAKE_OUTPUT_MM=115x100

# Hardware map (hw-map; docs/hardware-map.md). Battery/charger: pmic-glink battmgr (ROCKNIX's 0054
# rename to "battery" is not carried, so the names are the SM8550 ones). Backlight: the panel
# driver registers the DSI device's name, as on the Pocket DMG. CPU zone: the board DTS defines
# the zones; cpu6-0/7-0 are the A78 pair, not yet measured which runs hotter. Fan: pwm-fan on the
# pm6450 PWM with a tachometer. No LED class devices.
RETROFORGE_HW_BATTERY=qcom-battmgr-bat
RETROFORGE_HW_CHARGER=qcom-battmgr-usb
RETROFORGE_HW_BACKLIGHT=ae94000.dsi.0
RETROFORGE_HW_THERMAL_CPU=cpu6-0-thermal
RETROFORGE_HW_THERMAL_GPU=gpu-thermal
RETROFORGE_HW_FAN=pwmfan
RETROFORGE_HW_GPU_DEVFREQ=3d00000.gpu

# Wi-Fi power save off, as on the RG 55G1 (anbernic-rg55g1.conf, issue #27): the same SM4450 WLAN
# firmware (wpss.mbn). Measured on the RG 55G1 only.
RETROFORGE_WIFI_POWERSAVE=off
