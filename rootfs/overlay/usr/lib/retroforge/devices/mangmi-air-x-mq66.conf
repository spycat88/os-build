RETROFORGE_DEVICE_ID=mangmi-air-x-mq66
RETROFORGE_DEVICE_NAME='MANGMI Air X MQ66'
# Panel: HX83112A (mangmi,hx83112a) with the Himax HX83112A SPI touchscreen.
RETROFORGE_SOC_CLASS=SM6115
# Kernel suspend-to-RAM (retroforge-suspend kernel_sleep), not the fake-suspend default.
RETROFORGE_SUSPEND_MODE=mem

# MANGMI Air X — Snapdragon 662 (4x A73 + 4x A53, Adreno 610), 4 GB, eMMC + SD, no UFS. Three
# variants of one board that differ only in the panel (and the MQ66's SPI touch controller), so
# each has its own DTS and its own catalog row (boot/boards.map), and this conf is the same for
# all three bar the identity lines.
#
# One DSI link: the panel sits on mdss_dsi0 -> card0-DSI-1. 1080x1920 portrait native, 60 Hz only
# (all three panel drivers declare a single 60 Hz mode). NOT yet read off a device running
# RetroForge — taken from the panel drivers (kernel/patches/0565/0570/0575) and ROCKNIX's SM6115
# build, where the same DTS lights the same panel.
#
# The DTS panel declares rotation=<270>; gamescope reads that off the connector as before (no
# flag). OpenABL rotates its own menu from the firmware/devicetree; nothing here feeds it.
RETROFORGE_PRIMARY_CONNECTOR=DSI-1
RETROFORGE_PANEL_NATIVE_WIDTH=1080
RETROFORGE_PANEL_NATIVE_HEIGHT=1920
RETROFORGE_PANEL_REFRESH_RATES=60
# 16:9 landscape -> the fleet's 177x100 density value (see defaults.conf). Not yet measured on
# this panel.
RETROFORGE_GAMESCOPE_FAKE_OUTPUT_MM=177x100

# Hardware map (hw-map; docs/hardware-map.md). Detection resolved these on an Air X (2026-10-10);
# the CPU zone and the rings were chosen there, the rest are pinned so they no longer hang on sort
# order. Battery: the cw221x gauge (`battery`, which also registers the battery-thermal zone);
# bq256xx-battery beside it is the charger's companion node and reports no capacity. Charger: the
# SGM41515 on the bq256xx driver. Backlight: the pwm-backlight node. CPU zone: there is one per
# core plus per-cluster ones, and the A73 pair (cpu67) runs hottest. Fan: the pwm-fan over a GPIO
# PWM, no tachometer. GPU: SM6115's is at 5900000, not the SM8xxx 3d00000. LEDs: the two nine-pixel
# stick rings, leds-group-multicolor rgb:l1-l9 / rgb:r1-r9 over two aw20036s (the left_*/right_*
# single-colour nodes are the same diodes' channels).
RETROFORGE_HW_BATTERY=battery
RETROFORGE_HW_CHARGER=bq256xx-charger
RETROFORGE_HW_BACKLIGHT=backlight
RETROFORGE_HW_THERMAL_CPU=cpu67-thermal
RETROFORGE_HW_THERMAL_GPU=gpu-thermal
RETROFORGE_HW_THERMAL_BATTERY=battery-thermal
RETROFORGE_HW_FAN=pwmfan
RETROFORGE_HW_GPU_DEVFREQ=5900000.gpu
RETROFORGE_HW_LED_GROUPS="ring-left=rgb:l* ring-right=rgb:r*"

# Fan: a pwm-fan over a 15 Hz GPIO PWM (kernel/dts .../sm6115-mangmi-air-x-base.dtsi). Listening
# tests on the Air Y 2026-10-11: 15 Hz is the best rate and runs smoothly at 40% duty -> floor 102;
# off below 60 C, so the idle shell is silent (it used to be either off or full speed).
RETROFORGE_FAN_MIN_PWM=102
RETROFORGE_FAN_OFF_BELOW=60

# Stock scheduler only. scx_lavd on this SoC put one of two game threads on the A53s, which then
# missed 76-86% of its 60 fps deadlines under every governor (HW, Air X, 2026-10-10).
RETROFORGE_CPU_SCHEDULERS=none

# The shell on OpenGL: ~130 MiB more RAM left on a 3.5 GB board, against more long frames while
# navigating than Vulkan (HW, Air X, 2026-10-24). Settings > Display > Vulkan renderer switches it.
RETROFORGE_UI_RENDERER=opengl

# Games and Steam get a 1280x720 display, scaled to the panel by the DPU plane: Steam's Big Picture
# ran at ~38 fps at 1920x1080 on the Adreno 610 (GPU 95% busy) and ~58 at 1280x720 (69%), and the
# plane scaled the 720x1280 pre-rotated copy for free (HW, Air X, 2026-10-10).
RETROFORGE_GAMESCOPE_NESTED_W=1280
RETROFORGE_GAMESCOPE_NESTED_H=720
