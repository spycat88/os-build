# The shell runs as `player`, and tailscaled only takes changes (up, down, login) from root or its
# operator. Settings > Network > VPN (the RetroForge plugin's tailscale_settings.gd) runs the CLI as
# the session user, so `player` is made the operator each time the daemon starts. `tailscale set`
# edits the stored prefs only: it neither connects nor needs a login. Type=notify, so the local API
# is listening by the time this runs. Best effort (-): a failure leaves the daemon running and the
# switch reports what the CLI said.
[Service]
ExecStartPost=-/usr/bin/tailscale set --operator=player
