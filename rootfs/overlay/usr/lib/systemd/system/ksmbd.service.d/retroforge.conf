# The shares are folders on /home, a separate partition (nofail): serve once it is mounted.
[Unit]
RequiresMountsFor=/home

# The config ksmbd runs on is /run/retroforge/ksmbd.conf: /etc/ksmbd/ksmbd.conf, plus the [sdcard]
# share while an SD card is in (usr/lib/retroforge/storage/sdcard-share, which also rewrites it as a
# card comes and goes). Written before every start, so it always matches /etc and the slot.
[Service]
ExecStartPre=/usr/lib/retroforge/storage/sdcard-share auto
ExecStart=
ExecStart=/usr/bin/ksmbd.mountd -C /run/retroforge/ksmbd.conf
