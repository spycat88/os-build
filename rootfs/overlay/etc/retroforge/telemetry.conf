# retroforge-telemetry — image/operator settings. See docs/telemetry.md.
#
# Nothing is sent without the user's yes: TELEMETRY=on in /home/player/.config/retroforge/telemetry.conf,
# which the first-boot consent screen writes (or `retroforge-telemetry enable`). This file can only take
# that away: TELEMETRY=off here ships an image that never reports, whatever the user answered.
#TELEMETRY=off

# Where reports go.
#TELEMETRY_URL=https://telemetry.retroforge.org/report.php
