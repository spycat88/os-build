# retroforge-telemetry — image/operator settings. See docs/telemetry.md.
#
# The user's own switch is /home/player/.config/retroforge/telemetry.conf (`retroforge-telemetry
# disable` writes it) and wins over this file; retroforge.telemetry=0 on the kernel command line wins
# over both.

# on (default) or off. Set off here to ship an image that never reports.
#TELEMETRY=on

# Where reports go.
#TELEMETRY_URL=https://telemetry.retroforge.org/v1/report
