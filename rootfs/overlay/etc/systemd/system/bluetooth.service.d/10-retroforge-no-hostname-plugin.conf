# retroforge: start bluetoothd without its hostname plugin, so the Bluetooth name other devices see
# is main.conf's Name (RetroForge) and not systemd-hostnamed's hostname (retroforge). The plugin
# reads only hostnamed's hostnames, never /etc/os-release's PRETTY_NAME.
[Service]
ExecStart=
ExecStart=/usr/lib/bluetooth/bluetoothd -P hostname
