; RetroForge network shares: the player's ROMs, BIOS, saves and save states (the layout in
; /usr/share/user-tmpfiles.d/retroforge-home.conf), served by ksmbd, the in-kernel SMB3 server.
;
; Decided 2026-10-03: ON by default, GUEST read-write, no password -- anyone on the same network
; can read and write these four folders. Not the rest of the home (emulators, settings, dotfiles).
; Every guest is mapped to the player user, so files copied in are owned by player and readable by
; the emulators.
;
; Clients: Linux, macOS and Android file managers connect as guest out of the box
; (smb://retroforge.local, announced over mDNS by /etc/avahi/services/smb.service). Windows 10/11
; refuse SMB guest logins by default (insecure guest auth off; 24H2 also requires signing).
[global]
	netbios name = RETROFORGE
	server string = RetroForge
	map to guest = bad user
	guest account = player
	create mask = 0644
	directory mask = 0755

	; Transfers from Windows failing with 0x8007003B ("an unexpected network error occurred") while
	; dmesg logs "ksmbd: Failed to send message: -32" (2026-11-25). -32 is EPIPE: ksmbd answered on
	; a connection that was already gone. ksmbd has no interim (STATUS_PENDING) reply for a WRITE, so
	; a request that waits too long (about 60 s) makes Windows drop the connection. With the
	; defaults (8192 credits, 4 MB I/O) it can have hundreds of MB of writes queued ahead of an SD
	; card or a small dirty cache (vm.dirty_bytes 48 MB). ksmbd 7.3.x also aborts a connection
	; whose queued reply is not sent within 5 s, and a 4 MB READ reply on weak Wi-Fi can miss that.
	;
	; 512 credits at 1 MB per request: at most 32 MB in flight per connection. That drains in
	; about 8 s at 4 MB/s and is still far more than Wi-Fi needs to stay busy.
	smb2 max credits = 512
	smb2 max read = 1MB
	smb2 max write = 1MB
	; A brief Wi-Fi drop (roam, interference, the card resetting) then no longer fails the copy:
	; Windows reconnects and reclaims its open files instead of reporting 0x8007003B. Durable
	; handles need a batch oplock or a lease, and leases are on by default (smb2 leases = yes).
	durable handles = yes

; ksmbd-tools adds [ipc$] itself, without guest ok, so a guest could not even list the shares.
[ipc$]
	guest ok = yes

[roms]
	comment = ROMs, one folder per system
	path = /home/player/roms
	guest ok = yes
	read only = no

[bios]
	comment = BIOS files
	path = /home/player/bios
	guest ok = yes
	read only = no

[saves]
	comment = Memory cards and saves, one folder per system
	path = /home/player/saves
	guest ok = yes
	read only = no

[states]
	comment = Save states, one folder per system
	path = /home/player/states
	guest ok = yes
	read only = no
