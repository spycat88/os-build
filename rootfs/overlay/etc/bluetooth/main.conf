# retroforge: bluetoothd configuration. Replaces bluez's stock main.conf, whose every setting is
# commented out, so anything not set here keeps bluez's built-in default.
#
# Bluetooth starts powered OFF on a fresh image. bluez's AutoEnable (default true) powers every
# controller on as soon as it appears; with it off the controller stays down until it is turned on.
[Policy]
AutoEnable=false
