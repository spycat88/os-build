# retroforge RAUC system configuration.
#
# The boot chain is ABL (OpenABL) -> a Boot Loader Specification entry on the shared ESP -> kernel.
# Each slot has one entry, \loader\entries\retroforge-<a|b>+N.conf, whose +N is a boot counter
# OpenABL counts down, and \loader\loader.conf's `default` names the primary slot; the slot's
# kernel, initramfs and DTBs sit beside it under \retroforge\<a|b> (lib-bls.sh has the layout).
# A slot with no tries left is sorted last and the default no longer picks it, so OpenABL boots the
# other slot.
#
# `bootloader=custom` hands that state to retroforge-bootctl, which implements RAUC's custom backend
# interface (get-primary, set-primary, get-state, set-state, get-current) over those files.
# `bootname=A|B` is what RAUC passes it.
#
# The booted slot comes from `rauc.slot=A|B` on the kernel command line, which every entry carries.
# Without it RAUC would fall back to `root=`, which names a PARTUUID it cannot map to a slot.
#
# The OS still decides "is this slot OK": retroforge-bootctl mark-good confirms a healthy session
# with `rauc status mark-good booted`, and a failed health check demotes the booted slot.

[system]
compatible=retroforge
bootloader=custom
# Must match `format=` in ota/rauc/manifest.raucm.in, or every bundle is rejected.
bundle-formats=verity

# WITHOUT THIS LINE `adaptive=block-hash-index` IN THE MANIFEST DOES NOTHING. rauc's
# write_image_to_dev() checks for a data directory before it will consider an adaptive method and
# otherwise `goto raw_copy` -- and it says so at g_message level, not as an error
# (_reference/rauc/src/update_handler.c:1003-1006, "Ignoring adaptive method since 'data-directory'
# is not configured"). So the failure mode of deleting this is not a broken update, it is every OTA
# quietly going back to a full 3.9G download with nothing red anywhere. Measured 2026-08-04: with
# it, a consecutive release moves ~125M instead of 3.90G (see docs/worklog/DONE.md for the method and numbers).
#
# WHY /home AND NOT /var. rauc requires a filesystem "not overwritten during updates", and /var is
# exactly that: /usr/lib/rauc/post-install.sh step 2 mkfs.ext4's the TARGET /var and rsyncs the
# running one over it on every install, so an index written there is per-slot state that gets
# stamped over. /home (p8, retroforge-home) is the only partition on the device that no update
# touches. It is deliberately NOT under the offload tree at /home/.retroforge/offload -- that tree is
# /var paths redirected onto /home, and this is the opposite: storage that must never be part of a
# slot. Sibling directory, same namespace.
#
# THE INDEX IS NOT A TRUST BOUNDARY, which is what makes a user-writable partition acceptable here.
# rauc re-hashes every block it takes from a local slot and compares it against the index inside
# the bundle, and that index is covered by the signature. A corrupted or tampered data directory
# can therefore only cause blocks to be re-fetched -- it cannot put unverified bytes in a slot. The
# directory is still created 0700 root (rootfs/assemble-rootfs.sh), because "cannot be exploited"
# is not a reason to leave it writable.
#
# SIDE EFFECT, deliberate: setting this implies statusfile=<data-directory>/central.raucs. Until
# now our type=raw slots had nowhere to keep slot status at all ("Using per-slot statusfile. System
# status information not supported!" on every install), so this is new capability rather than a
# migration -- but retroforge-update's staged_identity() reads GetSlotStatus, so that path is
# load-bearing and covered by tests/test-update.sh.
data-directory=/home/.retroforge/rauc

[keyring]
# Installed from the committed CA (ota/rauc/retroforge-ca.pem) by rootfs/assemble-rootfs.sh.
# rootfs/guard-rootfs.sh asserts it is present in the built tree: a missing keyring does not
# fail loudly at install time, it just means nothing meaningful is being verified.
path=/etc/rauc/keyring.pem
# ota/gen-signing-ca.sh gives the release cert extendedKeyUsage=codeSigning, deliberately: that is
# what stops a leaked signing key being usable to terminate TLS. RAUC's DEFAULT verification
# purpose is smimesign, which accepts only emailProtection or no EKU at all -- so without this
# line the two ends disagree and EVERY bundle is rejected with "unsuitable certificate purpose".
# Changing this to match the cert, rather than widening the cert's EKU, keeps that restriction.
check-purpose=codesign

[handlers]
# Runs AFTER the new slot is written and unmounted. Randomises the target's btrfs fsid, migrates
# the per-slot /var identity, puts the slot's kernel onto the ESP, and re-arms the trial with a
# fresh boot entry. Without it the freshly installed slot is not actually usable — see the script's
# own header.
post-install=/usr/lib/rauc/post-install.sh
# The slot state: the boot entries on the ESP (see the top of this file).
bootloader-custom-backend=/usr/bin/retroforge-bootctl

# Raw slots: the bundle carries a whole btrfs image and RAUC writes it out verbatim. Do NOT change
# this to a filesystem type -- the image's fsid is rewritten by the post-install hook afterwards,
# which assumes it owns the bytes on the device.
#
# /dev/retroforge/, NOT /dev/disk/by-partlabel/. Every retroforge medium carries the same eight GPT
# names, so by-partlabel names whichever disk udev enumerated first: with a card inserted in a
# device installed to internal storage, an OTA taken from the card would write the bundle into the
# INTERNAL disk's slot and then hand it to a post-install hook reasoning about the card's. The
# scoped links resolve only partitions on the disk we booted from -- see
# /usr/lib/retroforge/on-boot-disk, which also documents why they fall back to naming every retroforge
# partition when the boot disk cannot be determined (that fallback is exactly the old behaviour).
#
# PARSING THIS FILE DOES NOT TOUCH THE DEVICES. config_file.c's slot loader only string-checks
# `device` (a /dev/ prefix for jffs2, an eMMC boot0/boot1 suffix) and never stats it, so a link that
# is momentarily absent cannot turn into a config rauc rejects -- it surfaces later, as a failed
# install, on a device that still boots. rootfs/guard-rootfs.sh assertion 7b is what keeps a missing
# link from shipping at all: it fails the BUILD if the rule or its match program is not in the image.
[slot.rootfs.0]
device=/dev/retroforge/retroforge-root-A
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/retroforge/retroforge-root-B
type=raw
bootname=B
